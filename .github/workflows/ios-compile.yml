name: iOS compile check

# Unsigned simulator build, launch, screenshots. Needs no Apple account.
# The signed device build lives in testflight.yml.

# GitHub only has main; work branches stay local and are checked with tools/check-app.sh.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-compile.yml"
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      # Also run on Windows, but Apple's Foundation differs from swift-corelibs in places
      # (XMLParser, string encodings), so CI runs them again.
      - name: ShioriCore tests
        run: swift test --package-path ios/Packages/ShioriCore

      # GRDB, ZIP, decoding and the importer: these run nowhere but here.
      - name: ShioriLibrary tests
        run: swift test --package-path ios/Packages/ShioriLibrary

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd ios && xcodegen generate

      # Screenshots are reviewed at the 17 Pro Max's size (1320 x 2868). The image ships
      # some iPhones but not necessarily that one, so create it from its device type when
      # needed. A fallback keeps the check running, but never on a two-display device such
      # as "iPhone Duo", which `simctl io screenshot` refuses.
      - name: Boot a simulator
        id: sim
        run: |
          read -r UDID NAME_OK NAME <<<"$(python3 -c "
          import json, subprocess, sys
          WANT = 'iPhone 17 Pro Max'
          def simctl(*args):
              return json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', *args, '-j']))
          def version(r):
              return tuple(int(x) for x in r['version'].split('.'))
          runtimes = sorted((r for r in simctl('runtimes', 'available')['runtimes']
                             if r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS')),
                            key=version, reverse=True)
          devices = simctl('devices', 'available')['devices']
          types = [t for t in simctl('devicetypes')['devicetypes'] if t['name'].startswith('iPhone')]
          print('iOS runtimes:', [r['name'] for r in runtimes], file=sys.stderr)
          print('iPhone device types:', [t['name'] for t in types], file=sys.stderr)
          for r in runtimes:
              for d in devices.get(r['identifier'], []):
                  if d['name'] == WANT:
                      print(d['udid'], 'yes', d['name']); sys.exit()
          for t in types:
              if t['name'] != WANT:
                  continue
              for r in runtimes:
                  try:
                      udid = subprocess.check_output(['xcrun', 'simctl', 'create', WANT, t['identifier'], r['identifier']], text=True).strip()
                      print(udid, 'yes', WANT); sys.exit()
                  except subprocess.CalledProcessError:
                      print('could not create', WANT, 'on', r['name'], file=sys.stderr)
          singles = [d for d in devices.get(runtimes[0]['identifier'], [])
                     if d['name'].startswith('iPhone') and 'Duo' not in d['name']]
          pick = next((d for d in reversed(singles) if 'Pro Max' in d['name']), singles[-1])
          print(pick['udid'], 'no', pick['name'])
          ")"
          if [ "$NAME_OK" != yes ]; then
            echo "::warning::No iPhone 17 Pro Max simulator on this image; using $NAME. Screenshot sizes will differ."
          fi
          echo "Booting $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true

      - name: Build for simulator
        run: |
          set -o pipefail
          # Ad-hoc signed rather than CODE_SIGNING_ALLOWED=NO so entitlements still embed.
          xcodebuild \
            -project ios/Shiori.xcodeproj \
            -scheme Shiori \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      # Compiling only proves it parses. Launching proves the first screen does not
      # crash, and the screenshots are the only look at the UI before TestFlight.
      - name: Install, launch and screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=com.kaichuan.shiori
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Shiori.app
          mkdir -p shots
          xcrun simctl launch "$UDID" $APP
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/01-first-launch.png
          # Debug builds read demo launch arguments (DemoLaunch.swift), so every screen can be
          # shot. `shot` uses the real, empty library; `shoot` adds -DemoData YES, a throwaway
          # library with three generated books.
          shot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" $APP || true
            xcrun simctl launch "$UDID" $APP "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shoot() { name=$1; wait=$2; shift 2; shot "$name" "$wait" -DemoData YES "$@"; }
          shot 02-shelf-empty 8 -DemoTab shelf
          shoot 03-import 10 -DemoTab imports -DemoImportResults YES
          shoot 04-shelf 10 -DemoTab shelf
          shoot 05-settings 8 -DemoTab settings
          shoot 06-reader 12 -DemoTab shelf -DemoReader 1
          shoot 07-contents 12 -DemoTab shelf -DemoReader 1 -DemoContents YES
          xcrun simctl ui "$UDID" appearance dark
          shoot 04-shelf-dark 10 -DemoTab shelf
          shoot 06-reader-dark 12 -DemoTab shelf -DemoReader 1
          xcrun simctl ui "$UDID" appearance light
          ls -la shots

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name "Shiori*" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then
            echo "CRASHES FOUND:"; ls -la shots/crashes; head -60 shots/crashes/* || true
          else
            echo "no crash reports"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
